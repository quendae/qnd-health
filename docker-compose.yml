services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qnd_health}
      POSTGRES_USER: ${POSTGRES_USER:-qnd_health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - qnd-health-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qnd_health} -d ${POSTGRES_DB:-qnd_health}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-qnd_health}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qnd_health}?schema=public
      TOKEN_PEPPER: ${TOKEN_PEPPER}
      TIME_ZONE: ${TIME_ZONE:-Europe/Warsaw}
      PUBLIC_URL: ${PUBLIC_URL:-https://fit.qqnd.fyi}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GARMIN_CLIENT_ID: ${GARMIN_CLIENT_ID:-}
      GARMIN_CLIENT_SECRET: ${GARMIN_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  qnd-health-postgres:
