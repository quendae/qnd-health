services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qnd_health
      POSTGRES_USER: qnd_health
      POSTGRES_PASSWORD: qnd_health
    ports:
      - "5432:5432"
    volumes:
      - qnd-health-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qnd_health -d qnd_health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qnd-health-postgres:
