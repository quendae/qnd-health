name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @qnd-health/api prisma:generate
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm smoke:runtime
      - run: pnpm smoke:native
      - run: docker build -t qnd-health-ci .
